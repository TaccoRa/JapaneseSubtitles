<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui;width:340px;padding:12px;color:#192c33}label{display:block;margin:12px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:8px}button{margin-top:14px;background:#17596b;color:white;border:0;border-radius:6px}#status{white-space:pre-wrap}small{color:#53636a}
</style></head><body><h3>Connect SubtitlePlayer</h3>
<p>Connect once, then allow the connection in SubtitlePlayer. It will remember this browser.</p>
<details><summary>Manual pairing fallback</summary><label for="token">Pairing code</label><input id="token" type="password" autocomplete="off"></details>
<label for="video">Video in this tab</label><select id="video"></select>
<button id="connect">Connect video and enable recording</button>
<button id="disconnect">Disconnect</button><p id="status" role="status"></p>
<small>Audio analysis stays on this computer. Keep watching in this tab. Original subtitle files stay unchanged.</small>
<script type="module" src="popup.js"></script></body></html>
