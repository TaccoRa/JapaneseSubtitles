<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui;width:340px;padding:12px;color:#192c33}label{display:block;margin:12px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:8px}button{margin-top:14px;background:#17596b;color:white;border:0;border-radius:6px}#status{white-space:pre-wrap}small{color:#53636a}
</style></head><body><h3>Connect SubtitlePlayer</h3>
