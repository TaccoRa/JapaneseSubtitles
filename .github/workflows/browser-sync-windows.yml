name: Browser sync Windows acceptance
on:
  push:
    branches: [feature/browser-sync-native-capture]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build packaged alignment helper
        run: |
          cargo build --release --manifest-path native/subtitle-align/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force SubtitlePlayer/bin
          Copy-Item native/subtitle-align/target/release/subtitle-align.exe SubtitlePlayer/bin/
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest dev/tests/model dev/tests/test_subtitle_alignment_probe.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test dev/tests/extension.test.cjs dev/tests/content.test.cjs dev/tests/offscreen.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem browser-extension -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - uses: actions/upload-artifact@v4
        with:
          name: SubtitlePlayer-browser-sync-Windows
          path: |
            SubtitlePlayer/bin/subtitle-align.exe
            browser-extension/
